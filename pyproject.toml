[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-guard"
version = "0.1.0"
description = "Ontology/graph-aware retrieval over a personal knowledge vault: typed knowledge graph + multi-hop PageRank retrieval behind rag-guard's retrieve() seam, with tightened grounding. Tier A = pragmatic working core; Tier B = RDF/OWL/SPARQL enterprise-fidelity layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeff Otterson" }]
keywords = ["knowledge-graph", "graphrag", "ontology", "rag", "retrieval", "personal-knowledge-graph"]
dependencies = ["guarded-rag @ git+https://github.com/Jott2121/rag-guard.git"]   # Tier A core is stdlib beyond this; Tier B adds rdflib; not on PyPI, pulled from GitHub

[project.scripts]
graph-guard-build = "graph_guard.build_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mutmut>=3"]
graph = ["networkx>=3"]           # optional: drop-in for the stdlib PageRank
rdf = ["rdflib>=7", "pyshacl", "owlrl"]  # Tier B: RDF/OWL/SHACL export + reasoning

[tool.setuptools.packages.find]
include = ["graph_guard*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
graph_guard = ["ontology_data/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
# Phase 1: only mutate the metrics module (the code behind the Gate D lift numbers),
# and only run the tests that actually exercise it (keeps the run fast + avoids importing
# the top-level `eval` package, which isn't visible inside mutmut's mutants/ copy).
source_paths = ["graph_guard/eval_metrics.py"]
pytest_add_cli_args_test_selection = ["tests/test_eval_metrics.py", "tests/test_eval_metrics_properties.py"]

[tool.coverage.run]
source = ["graph_guard"]
# relative_files lets the coverage-comment action resolve paths from a checkout
relative_files = true
