name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,rdf]" pytest-cov
      - name: Run tests + coverage gate
        run: python -m pytest -q --cov=graph_guard --cov-report=term-missing --cov-fail-under=90

  coverage:
    # Coverage badge + per-PR comment (self-contained, no third-party service).
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,rdf]" coverage
      - name: Measure coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Coverage badge + PR comment
        uses: py-cov-action/python-coverage-comment-action@cc6cde2639ed103404ce0da9e75114ae9561e691 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  receipts:
    # Cross-check the structure-derived contrast against eval/results.json.
    # The real-session headline has no public raw artifact; the script locks
    # those README strings instead of recomputing them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check published numbers
        run: python scripts/check_receipts.py

  no-employer-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Employer names live only as SHA-256 digests in .github/blocked-terms.sha256,
      # so the scan covers every tracked file with no exclusions. The script exits
      # non-zero on a hit and on a missing, empty, or malformed hash file.
      # BLOCKED_TERMS is an optional secret with extra comma-separated terms.
      - name: Block employer names (hashed terms, whole tree)
        env:
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
        run: python3 scripts/scan_blocked_terms.py
      # AGENTS.md and .cursor/ name these markers in policy text; .github/
      # contains this pattern itself.
      - name: Block export-control markers and committed build junk
        run: |
          # bash -e does not abort on a failing `!` command, so `! git grep`
          # stays green when a banned term is present. Branch on git's own
          # exit codes instead: 0 = hit (fail), 1 = clean, anything else = fail.
          status=0
          git grep -nIiE '\bCUI\b|ITAR|EXPORT CONTROLLED|PROPRIETARY' -- . ':!.cursor' ':!AGENTS.md' ':!.github' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "export-control marker found" >&2
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "marker scan failed to run (git grep exit $status)" >&2
            exit 1
          fi
          status=0
          git ls-files | grep -E '(__pycache__/|\.pyc$|^\.coverage$)' || status=$?
          if [ "$status" -eq 0 ]; then
            echo "committed build junk found" >&2
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "build-junk scan failed to run (exit $status)" >&2
            exit 1
          fi
