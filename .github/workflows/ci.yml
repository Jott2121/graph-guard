name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,rdf]" pytest-cov
      - name: Run tests + coverage gate
        run: python -m pytest -q --cov=graph_guard --cov-report=term-missing --cov-fail-under=90

  coverage:
    # Coverage badge + per-PR comment (self-contained, no third-party service).
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,rdf]" coverage
      - name: Measure coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Coverage badge + PR comment
        uses: py-cov-action/python-coverage-comment-action@cc6cde2639ed103404ce0da9e75114ae9561e691 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  receipts:
    # Cross-check the structure-derived contrast against eval/results.json.
    # The real-session headline has no public raw artifact; the script locks
    # those README strings instead of recomputing them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check published numbers
        run: python scripts/check_receipts.py

  no-employer-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The README author byline and pyproject authors do not name an employer,
      # so README.md stays in the scan. Excluding it would hide a later slip.
      # AGENTS.md and .cursor/ name the banned terms in policy text; .github/
      # contains this pattern itself.
      - name: Block employer / export-control markers and committed build junk
        run: |
          ! git grep -nIiE 'lockheed|\blmco\b|\bCUI\b|ITAR|EXPORT CONTROLLED|PROPRIETARY' -- . ':!.cursor' ':!AGENTS.md' ':!.github'
          ! git ls-files | grep -E '(__pycache__/|\.pyc$|^\.coverage$)'
